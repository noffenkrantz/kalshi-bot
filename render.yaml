# Render Blueprint: the bot's always-on home (python -m bot serve). See SETUP.md > Turn it on.
# It runs research every 4 hours plus the rain watcher, and saves results to this repo.
# Render dashboard: New > Blueprint > pick this repo. It asks for the two secrets once.
# Uses Render's default worker size (the smallest paid instance); background workers have no free tier.
services:
  - type: worker
    name: kalshi-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    maxShutdownDelaySeconds: 60    # time to save and push results when Render restarts it
    buildFilter:
      paths:                       # redeploy only for code changes, not the bot's result commits
        - bot/**
        - Dockerfile
        - requirements.txt
    envVars:
      - key: GITHUB_TOKEN          # fine-grained token: Contents read/write on this repo only
        sync: false
      - key: ANTHROPIC_API_KEY     # Claude API key for the research (console.anthropic.com)
        sync: false
