# Manual research run: deep survey of daily high / low temperature markets.
# "probe" prints the markets' rules; "full" writes TEMPS.md and data/temp_survey.json. Read-only.
name: temperature-survey

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe or full"
        default: "full"
      days:
        description: "Settled markets from this many days back"
        default: "14"

permissions:
  contents: write

concurrency:
  group: kalshi-bot
  cancel-in-progress: false

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe
        if: ${{ inputs.mode == 'probe' }}
        run: python -m bot tempsurvey --probe
      - name: Full survey
        if: ${{ inputs.mode != 'probe' }}
        run: python -m bot tempsurvey --days "${{ inputs.days }}"
      - name: Save the report
        if: ${{ inputs.mode != 'probe' }}
        run: |
          git config user.name "kalshi-bot"
          git config user.email "kalshi-bot@users.noreply.github.com"
          git add TEMPS.md data/temp_survey.json
          git commit -m "survey: daily temperature markets" || echo "nothing new"
          git pull --rebase --autostash || true
          git push || echo "push failed"
