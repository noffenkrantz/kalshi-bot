# Runs the bot automatically on GitHub's computers, about every 4 hours.
#
# Why hourly: GitHub often starts scheduled runs late or skips them when it's busy. So it
# checks every hour, and the "gate" job lets a real run through only once 3.5+ hours have
# passed since the last one. Skipped checks take a few seconds and cost nothing.
# Manual runs ("Run workflow") always go ahead.
#
# Brain, pick ONE secret:
#   CLAUDE_CODE_OAUTH_TOKEN  uses your Claude subscription (made with `claude setup-token`)
#   ANTHROPIC_API_KEY        pay-as-you-go Claude API instead
# It only simulates: real Kalshi markets and prices, fake money. It never places orders.
# Emergency stop: add a repository variable BOT_ENABLED = false (or disable this workflow).
name: kalshi-bot

on:
  schedule:
    - cron: "41 * * * *"     # check every hour at 41 past (UTC); the gate decides whether to run
  workflow_dispatch: {}       # adds a "Run workflow" button for manual runs

permissions:
  contents: write             # lets the job save the journal and dashboard back to the repo

concurrency:
  group: kalshi-bot
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ vars.BOT_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - name: Is a run due?
        id: check
        env:
          MIN_GAP_MINUTES: "210"    # 3.5 hours; with hourly checks this gives a run about every 4 hours
        run: |
          last=$(head -1 data/last_run.log 2>/dev/null | sed -n 's/^# Last run: //p')
          last_s=$(date -u -d "$last" +%s 2>/dev/null || echo 0)
          ago=$(( ($(date -u +%s) - last_s) / 60 ))
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            due=true; why="manual run"
          elif [ -z "$last" ]; then
            due=true; why="no previous run found"
          elif [ "$ago" -ge "$MIN_GAP_MINUTES" ]; then
            due=true; why="last run ${last:-unknown}, ${ago} min ago"
          else
            due=false; why="last run $last, only ${ago} min ago; waiting for ${MIN_GAP_MINUTES}"
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
          echo "Run due: $due ($why)" | tee -a "$GITHUB_STEP_SUMMARY"

  run:
    needs: gate
    if: ${{ needs.gate.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SUBSCRIPTION: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Start run log
        run: |
          mkdir -p data
          echo "# Last run: $(date -u '+%Y-%m-%d %H:%M UTC')" > data/last_run.log
          echo "brain: $([ "$HAS_SUBSCRIPTION" = true ] && echo 'Claude subscription' || ([ "$HAS_API_KEY" = true ] && echo 'API key' || echo 'NOT SET UP'))" >> data/last_run.log

      - name: Waiting for setup
        if: ${{ env.HAS_SUBSCRIPTION != 'true' && env.HAS_API_KEY != 'true' }}
        run: |
          echo "### Not set up yet" >> "$GITHUB_STEP_SUMMARY"
          msg="Add the ANTHROPIC_API_KEY secret (or CLAUDE_CODE_OAUTH_TOKEN) - see SETUP.md > Quick start - and the bot starts on its next run."
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> data/last_run.log

      # ---- subscription mode: Claude Code does the research ----
      - name: Pick markets to research
        id: prep
        if: ${{ env.HAS_SUBSCRIPTION == 'true' }}
        run: |
          printf "\n## prepare\n" >> data/last_run.log
          python -m bot prepare 2>&1 | tee -a data/last_run.log

      - uses: actions/setup-node@v4
        if: ${{ env.HAS_SUBSCRIPTION == 'true' && steps.prep.outputs.count != '0' }}
        with:
          node-version: "22"

      - name: Claude researches (uses your Claude plan)
        if: ${{ env.HAS_SUBSCRIPTION == 'true' && steps.prep.outputs.count != '0' }}
        continue-on-error: true
        timeout-minutes: 25
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Read work/INSTRUCTIONS.md and follow it exactly." \
            --allowedTools "Read,Edit(./work/estimates/**),WebSearch,WebFetch" \
            --permission-mode dontAsk \
            --max-turns 100 \
            --model sonnet 2>&1 | tail -20 | tee -a data/last_run.log

      - name: Record Claude's forecasts
        if: ${{ env.HAS_SUBSCRIPTION == 'true' && steps.prep.outputs.count != '0' }}
        run: |
          printf "\n## ingest\n" >> data/last_run.log
          python -m bot ingest 2>&1 | tee -a data/last_run.log

      # ---- decide and record simulated trades ----
      - name: Simulated trading (real markets and prices, fake money)
        if: ${{ env.HAS_SUBSCRIPTION == 'true' || env.HAS_API_KEY == 'true' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          printf "\n## run --mode shadow\n" >> data/last_run.log
          python -m bot run --mode shadow 2>&1 | tee -a data/last_run.log

      # ---- lag scanner: where do prices keep drifting after news? (no Claude, read-only) ----
      - name: Lag scan
        continue-on-error: true
        timeout-minutes: 15
        run: |
          printf "\n## lag scan\n" >> data/last_run.log
          python -m bot lags --scan 2>&1 | tee -a data/last_run.log

      - name: Report
        if: ${{ env.HAS_SUBSCRIPTION == 'true' || env.HAS_API_KEY == 'true' }}
        continue-on-error: true
        run: |
          printf "\n## report\n" >> data/last_run.log
          python -m bot report 2>&1 | tee -a data/last_run.log

      - name: Save journal
        if: always()
        run: |
          git config user.name "kalshi-bot"
          git config user.email "kalshi-bot@users.noreply.github.com"
          git add data/ REPORT.md README.md LAGS.md site/ 2>/dev/null || git add data/
          git commit -m "journal: run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing new"
          git pull --rebase --autostash || true
          git push || echo "push failed; will retry next run"

  # Publishes the freshly built results page (site/) to GitHub Pages, only after a real run.
  # (The "results-site" workflow, pages.yml, is the manual "publish now" button.)
  pages:
    needs: run
    if: ${{ !cancelled() && needs.run.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # includes the results the run just saved
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true   # GitHub sometimes can't find a just-uploaded page; retry once below
      - name: Wait before retrying
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 30
      - id: deployment2
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
