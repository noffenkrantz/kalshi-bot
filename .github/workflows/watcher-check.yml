# Manual test of the data watcher against live Kalshi and National Weather Service data.
# Prints what it sees to the log. Changes nothing and places no trades.
name: watcher-check

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m bot watch --inspect
