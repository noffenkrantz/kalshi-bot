# Publishes the results page (site/index.html) to GitHub Pages whenever it changes on main
# (each run on Render pushes a new one), plus a manual "publish now" button.
# Runs of the GitHub backup workflow (bot.yml) publish the page themselves, because pushes
# made with GitHub's built-in token don't start other workflows.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The page is then at https://<your-username>.github.io/<repo-name>/
# To take it down: Settings → Pages → Unpublish site.
name: results-site

on:
  push:
    branches: [main]
    paths: ["site/**", "!site/gaps.json"]   # gaps.json alone needs no redeploy: the page fetches it from the repo
  workflow_dispatch: {}       # adds a "Run workflow" button to publish right now

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true   # GitHub sometimes can't find a just-uploaded page; retry once below
      - name: Wait before retrying
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 30
      - id: deployment2
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
