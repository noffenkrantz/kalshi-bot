# Manual "publish now" button for the results page (site/index.html) on GitHub Pages.
# The bot workflow (bot.yml) already publishes the page at the end of every real run;
# use this only to republish without running the bot.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The page is then at https://<your-username>.github.io/<repo-name>/
# To take it down: Settings → Pages → Unpublish site.
name: results-site

on:
  workflow_dispatch: {}       # adds a "Run workflow" button to publish right now

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true   # GitHub sometimes can't find a just-uploaded page; retry once below
      - name: Wait before retrying
        if: ${{ steps.deployment.outcome == 'failure' }}
        run: sleep 30
      - id: deployment2
        if: ${{ steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
